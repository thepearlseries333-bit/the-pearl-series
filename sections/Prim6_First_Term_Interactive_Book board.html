<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prim.6 First Term — Smartboard Edition | Youssef Osman • The Pearl Series</title>
<style>
:root{--bg:#eef2f7;--card:#ffffff;--text:#0f172a;--muted:#64748b;--primary:#2563eb;--p2:#7c3aed;--green:#15803d;--red:#dc2626;--accent:#f59e0b;--border:#cbd5e1}
[data-theme=dark]{--bg:#0b1220;--card:#15203a;--text:#f1f5f9;--muted:#9fb0cc;--green:#4ade80;--red:#f87171;--border:#2b3a5c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button,select{font-family:inherit}

#top{flex:0 0 auto;display:flex;align-items:center;gap:.7rem;padding:.35rem .9rem;background:linear-gradient(135deg,var(--primary),var(--p2));color:#fff}
#top img{width:2.4rem;height:2.4rem;border-radius:50%;object-fit:cover;border:2px solid #fff}
#top .brand{font-weight:800;line-height:1.15;font-size:.95rem;white-space:nowrap}
#top .brand small{display:block;font-weight:400;font-size:.7rem;opacity:.92}
#crumb{flex:1;text-align:center;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:.6rem;padding:.4rem .8rem;font-size:1rem;cursor:pointer;font-weight:700}
.tb:active{background:rgba(255,255,255,.4)}

#stage{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
#host{position:absolute;inset:0}
.slide{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;padding:1rem 2rem;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.inner{margin:auto;width:100%;max-width:92rem}
.center{text-align:center}
#pen{position:absolute;inset:0;z-index:5;pointer-events:none;touch-action:none}
#pen.on{pointer-events:auto;cursor:crosshair}
#palette{position:absolute;right:.8rem;bottom:.8rem;z-index:6;display:none;gap:.4rem;background:var(--card);border:1px solid var(--border);padding:.4rem;border-radius:1rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#palette.on{display:flex}
.pc{width:2.6rem;height:2.6rem;border-radius:50%;border:3px solid var(--card);cursor:pointer;font-size:1.2rem;background:var(--bg);color:var(--text);box-shadow:0 0 0 2px var(--border)}
.pc.sel{box-shadow:0 0 0 4px var(--primary)}

#prog{flex:0 0 .3rem;background:var(--border)}
#progbar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s}
#bottom{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;background:var(--card);border-top:1px solid var(--border)}
.nb{min-width:4.4rem;height:3.1rem;border-radius:.8rem;border:0;background:var(--primary);color:#fff;font-size:1.3rem;font-weight:800;cursor:pointer}
.nb.alt{background:var(--bg);color:var(--text);border:2px solid var(--border)}
.nb.on{background:var(--accent);color:#111}
#counter{flex:1;text-align:center;font-weight:800;color:var(--muted);font-size:1.05rem}

/* generic content */
.st{margin:0 0 .8rem;font-size:1.7rem;color:var(--primary)}
.st small,.hint2{font-size:.85rem;color:var(--muted);font-weight:400;margin-inline-start:.6rem}
.kicker{font-size:1.4rem;color:var(--muted);font-weight:700}
.ttl{font-size:5rem;margin:.2rem 0;color:var(--primary)}
.sub{font-size:2.4rem;margin:0;color:var(--p2)}
.bigicon{font-size:5rem}
.btn{background:var(--primary);color:#fff;border:0;border-radius:.7rem;padding:.6rem 1.2rem;font-size:1.15rem;font-weight:700;cursor:pointer}
.btn.sm{font-size:.85rem;padding:.35rem .8rem;margin-inline-start:.4rem;vertical-align:middle}
.btn.alt{background:var(--card);color:var(--text);border:2px solid var(--border)}
.spk{background:var(--accent);color:#111;border:0;border-radius:50%;width:3.2rem;height:3.2rem;font-size:1.5rem;cursor:pointer;vertical-align:middle}
.spk.sm{width:2.2rem;height:2.2rem;font-size:1rem}

.row{background:var(--card);border:2px solid var(--border);border-inline-start:.5rem solid var(--primary);border-radius:.8rem;padding:.7rem 1.1rem;margin:.55rem 0;font-size:1.45rem;line-height:1.5;cursor:pointer}
.row.shown{border-inline-start-color:var(--green)}
.row .q{font-weight:600}
.ans{display:none;color:var(--green);font-weight:800;margin-top:.25rem}
.shown .ans{display:block}
.blank{display:inline-block;min-width:3.6rem;text-align:center;padding:0 .4rem;border-bottom:.2rem solid var(--muted);color:transparent;font-weight:800}
.shown .blank{color:var(--green);border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin:.4rem 0 .8rem}
.chip{background:var(--card);border:2px solid var(--border);border-radius:2rem;padding:.35rem 1rem;font-size:1.3rem;font-weight:700;color:var(--text)}
.chip.btnlike{cursor:pointer;color:var(--text);font-size:1.5rem}

/* vocab */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.8rem}
.wcard{background:linear-gradient(135deg,var(--primary),#3b82f6);color:#fff;border:0;border-radius:1rem;padding:1rem .6rem;font-size:1.45rem;font-weight:800;cursor:pointer;min-height:5rem}
.wcard small{display:block;font-size:.75rem;font-weight:400;opacity:.9;margin-top:.2rem}
.cnt{color:var(--muted);font-weight:700;margin-bottom:.4rem}
.pos{display:inline-block;background:var(--p2);color:#fff;border-radius:2rem;padding:.15rem .9rem;font-size:1rem;margin-bottom:.4rem}
.wword{font-size:4.6rem;font-weight:900;color:var(--primary);margin:.2rem 0 1rem;line-height:1.1}
.mean{max-width:60rem;margin:0 auto;min-height:9rem;border:3px dashed var(--border);border-radius:1.2rem;padding:1.2rem 1.6rem;font-size:2rem;line-height:1.5;cursor:pointer;background:var(--card);display:flex;align-items:center;justify-content:center}
.mean .hint{color:var(--muted);font-size:1.4rem}
.mean.shown{border-style:solid;border-color:var(--green)}
.mean.shown .hint{display:none}
.mean .ans{margin:0}
.lang{list-style:none;margin:0;padding:0}
.lang li{background:var(--card);border:2px solid var(--border);border-radius:.8rem;padding:.7rem 1.1rem;margin:.55rem 0;font-size:1.5rem;cursor:pointer;line-height:1.45}
.sacols{display:flex;gap:1.4rem;flex-wrap:wrap}
.sacol{flex:1 1 20rem}
.sacol h3{margin:.2rem 0 .4rem;color:var(--p2);font-size:1.3rem}
table.sat,table.irr{width:100%;border-collapse:collapse;font-size:1.4rem}
table.sat td,table.irr td,table.irr th{border:2px solid var(--border);padding:.5rem .8rem;background:var(--card);cursor:pointer}
table.sat tr.shown td{background:rgba(22,163,74,.1)}
table.irr{font-size:1.05rem}
table.irr th{background:var(--primary);color:#fff;cursor:default}
table.irr td{padding:.25rem .5rem}
.irrwrap{display:flex;gap:.8rem}
.irrwrap table{flex:1}
.map{max-width:100%;max-height:calc(100% - 4rem);border-radius:1rem;border:3px solid var(--border);display:block;margin:0 auto}
.split{display:flex;gap:1.4rem;align-items:flex-start}
.split>*{flex:1 1 0;min-width:0}
.split .map{max-height:none;width:100%}
.rule{background:var(--card);border-inline-start:.5rem solid var(--primary);border-radius:.8rem;padding:1rem 1.4rem;font-size:1.45rem;line-height:1.6}
.rule table{width:100%;border-collapse:collapse;margin:.5rem 0}
.rule td,.rule th{border:2px solid var(--border);padding:.4rem .8rem;text-align:left}
.rule th{background:var(--bg)}
.passage{background:var(--card);border:2px solid var(--border);border-radius:1rem;padding:1rem 1.4rem;font-size:1.35rem;line-height:1.65;margin-bottom:.8rem}

/* mcq */
.mq{max-width:70rem}
.qh{color:var(--muted);font-weight:700;font-size:1.1rem;margin-bottom:.6rem}
.qt{font-size:2.3rem;font-weight:700;line-height:1.4;margin-bottom:1.4rem}
.qb{display:inline-block;min-width:6rem;border-bottom:.25rem solid var(--muted);text-align:center;color:var(--green)}
.qb.ok{font-weight:900}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.opt{background:var(--card);color:var(--text);border:3px solid var(--border);border-radius:1rem;padding:1rem 1.2rem;font-size:1.8rem;font-weight:700;text-align:start;cursor:pointer;min-height:5rem;display:flex;align-items:center;gap:.8rem}
.opt .ltr{background:var(--primary);color:#fff;border-radius:50%;min-width:2.4rem;height:2.4rem;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.opt.correct{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
.opt.locked{pointer-events:none}
.opts.small .opt{font-size:1.2rem;min-height:4rem}
.mqf{margin-top:1.2rem;text-align:center}

#drawer{position:fixed;inset:0 auto 0 0;width:24rem;max-width:90vw;background:var(--card);z-index:50;transform:translateX(-105%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.35)}
#drawer.open{transform:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;display:none}
#shade.open{display:block}
#dhead{padding:.8rem 1rem;border-bottom:1px solid var(--border);font-size:.95rem}
#dhead select{width:100%;padding:.4rem;border-radius:.5rem;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:.3rem 0}
#dhead .btn{margin:.2rem .2rem 0 0}
#dlist{flex:1;overflow:auto;padding:.5rem}
#dlist h4{margin:.9rem .4rem .3rem;font-size:.75rem;text-transform:uppercase;color:var(--muted)}
.mitem{display:block;width:100%;text-align:start;background:none;border:0;border-radius:.6rem;padding:.6rem .8rem;font-size:1.05rem;color:var(--text);cursor:pointer}
.mitem:hover,.mitem.cur{background:var(--primary);color:#fff}

.slide.cover{background:linear-gradient(135deg,var(--primary),var(--p2));color:#fff}
.cover .av{width:11rem;height:11rem;border-radius:50%;object-fit:cover;border:.3rem solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cover .series{font-size:2.6rem;font-weight:900;letter-spacing:.05rem;margin:.8rem 0 .2rem}
.cover .series small{display:block;font-size:1.3rem;font-weight:400;opacity:.95}
.cover h1{font-size:2.6rem;margin:.6rem 0}
.cover .by{display:inline-block;background:rgba(255,255,255,.2);padding:.5rem 1.6rem;border-radius:3rem;font-size:1.4rem;margin-bottom:1.2rem}
.cover .btn{background:#fff;color:var(--primary);font-size:1.6rem;padding:.8rem 2.4rem;border-radius:3rem}
.confetti{position:fixed;width:.6rem;height:.6rem;top:-1rem;z-index:99;pointer-events:none}
#toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:#111827;color:#fff;padding:.6rem 1rem;border-radius:.7rem;font-size:.9rem;z-index:99;opacity:0;transition:opacity .25s;max-width:88vw;text-align:center;pointer-events:none}
</style>
</head>

uldn't", "are", "have"], "a": "shouldn't"}, {"q": "2. You should ___ hard for the exam.", "opts": ["study", "studying", "to study", "studies"], "a": "study"}, {"q": "3. You ___ mute your phone at the library.", "opts": ["should", "to should", "able", "shouldn't"], "a": "shouldn't"}, {"q": "4. We ___ send an email. It's faster.", "opts": ["can't", "has", "mustn't", "should"], "a": "should"}, {"q": "5. We ___ help old people. It's very kind.", "opts": ["should", "have", "shouldn't", "mustn't"], "a": "should"}]}, {"type": "fill_list", "title": "B) Write the correct form of the word(s) between brackets:", "items": [["1- We ___ (shouldn't) eat lots of fruit and vegetables.", "shouldn't"], ["2- You should ___ (washed) your hands before meals.", "wash"], ["3- You ___ (should) play a lot of video games.", "shouldn't"], ["4- She should ___ (tidies) her room and keep it clean.", "tidy"], ["5- We should ___ (sleeping) for 8 hours a day.", "sleep"]]}, {"type": "rewrite", "title": "C) Rewrite using the words in brackets:", "items": [["1- You should be quiet at the library. (not)", "You shouldn't be quiet at the library."], ["2- It's good to take your umbrella when it's raining. (should)", "You should take your umbrella when it's raining."], ["3- Don't eat a lot of chocolate. (shouldn't)", "You shouldn't eat a lot of chocolate."], ["4- You are very tired. You can take a rest. (should)", "You should take a rest."], ["5- It is not healthy to drink too much soda. (shouldn't)", "You shouldn't drink too much soda."]]}]}, {"title": "Modals: must / mustn't", "rule": "<p>We use <b>must/mustn't</b> to talk about rules and obligations. <b>Must</b> = do it! <b>Mustn't</b> = don't do it (not allowed). Use the infinitive without <i>to</i>.</p><p>Ex: You must wear your school uniform. — You mustn't be late for class.</p>", "ex": [{"type": "mcq", "title": "Choose the correct answer:", "items": [{"q": "1. You must ___ attention at school.", "opts": ["to pay", "pays", "pay", "paying"], "a": "pay"}, {"q": "2. Students must ___ quiet in the library.", "opts": ["are", "is", "to be", "be"], "a": "be"}, {"q": "3. You mustn't ___ across the road.", "opts": ["run", "to run", "ran", "running"], "a": "run"}, {"q": "4. We ___ shout in class.", "opts": ["must", "have", "mustn't", "should"], "a": "mustn't"}, {"q": "5. Malek ___ help his brother with the homework.", "opts": ["must", "has", "shouldn't", "mustn't"], "a": "must"}]}, {"type": "fill_list", "title": "Write the correct form of the word(s) between brackets:", "items": [["1- You ___ (mustn't) take medicine when you are ill.", "mustn't"], ["2- You must ___ (been) careful when you cross the street.", "be"], ["3- You ___ (must) scare birds or animals.", "mustn't"], ["4- Students mustn't ___ (forgot) their homework.", "forget"], ["5- We must ___ (respecting) wildlife.", "respect"]]}, {"type": "rewrite", "title": "Rewrite using the words in brackets:", "items": [["1- We must sleep early. (not)", "We mustn't sleep early."], ["2- Don't ride your bike on the grass. (mustn't)", "You mustn't ride your bike on the grass."], ["3- Drink a lot of water in summer. (must)", "You must drink a lot of water in summer."], ["4- It's important to eat healthy food. (must)", "You must eat healthy food."]]}]}], "writing": {"theory": [{"h": "What is a paragraph?", "p": "A paragraph is a unit of writing that consists of some sentences which relate to the same topic. Each paragraph should focus on a single topic."}, {"h": "Parts of a paragraph (traffic-light idea)", "p": "1) Topic sentence (Go) — 2) Supporting ideas (Slow down) — 3) Closing sentence (Stop)."}, {"h": "1) Topic sentence", "p": "The first sentence of the paragraph. It introduces the main idea. Ex: My teacher is the best teacher."}, {"h": "Types of topic sentences", "p": "• Opinion: states an opinion — Living in the city is a very terrible thing.<br>• List: gives a list of categories — Gifts, cakes, and candles are found in birthdays.<br>• Number: includes a number/number word (some, many, several…) — There are many kinds of bats in the world."}, {"h": "2) Supporting ideas", "p": "The sentences after the topic sentence; they make up the body and tell more about the main idea."}, {"h": "3) Closing sentence", "p": "The last sentence of the paragraph. It repeats the main idea in different words."}, {"h": "Types of paragraphs", "p": "<b>Descriptive:</b> gives information, shows what a thing/person is like.<br><b>Narrative:</b> tells a story, focuses on one topic with each sentence adding detail.<br><b>Expository:</b> explains/discusses a single point or idea."}, {"h": "Mind mapping", "p": "A mind map is an easy way to brainstorm and organize ideas around a topic (Who, What, When, Where, How, feeling) before writing."}], "ex1_types": {"title": "1) Identify the type of the topic sentence:", "items": [["a) I think Egypt is the most wonderful country in the world.", "Opinion"], ["b) There are two types of maps in our classroom.", "Number"], ["c) Horses, chickens, and dogs live on farms.", "List"], ["d) Amazing students listen, write carefully, and follow directions.", "List"]]}, "ex_models": [{"title": "2) Sample topic sentences", "items": [["A famous person", "Albert Einstein is one of the most brilliant scientists in history."], ["Your favorite sport", "Football is definitely my favorite sport."], ["A trip to Alex", "Last summer, I had an unforgettable trip to Alexandria."], ["Watching movies", "Watching movies is my favorite way to relax."]]}, {"title": "3) Sample closing sentences", "items": [["Your free time", "In short, I always enjoy spending my free time this way."], ["Computers", "To sum up, computers have made our lives much easier."], ["Social Media", "Overall, social media has both good and bad sides."], ["Your Childhood", "In conclusion, my childhood was full of happy memories."]]}], "ex4_topic": {"title": "4) Complete the paragraph with a Topic sentence — 'An exciting party'", "answer": "It was an exciting party."}, "ex5_closing": {"title": "5) Complete the paragraph with a Closing sentence — 'The theme park'", "answer": "To sum up, the theme park is a fantastic place to have fun."}, "ex6_support": {"title": "6) Supporting sentences — 'Pollution'", "answer": "Cars and factories produce a lot of smoke that pollutes the air. People also throw rubbish into rivers and seas, which harms fish and other creatures. This pollution can make people sick and damage the environment."}, "ex7_order": {"title": "7) Number the parts of the paragraph, then rewrite it correctly:", "sentences": [["a", "He usually tells me about his struggle of life and his success."], ["b", "I always learn from his experiences."], ["c", "My father is very loving and dutiful person."], ["d", "He also teaches me about humanity."], ["e", "He teaches me how to be a good person."], ["f", "To sum up, my father is the best dad in the world."]], "order": ["c", "a", "e", "d", "b", "f"]}, "ex_identify": [{"passage": "Last week, I had a cold and I felt very sick. I had a cough and a runny nose. I also had a high fever. One Friday, I missed school and went to see a doctor. I had to lie in bed all day because of my cold. When I was sick, my mom stayed by my side. She made me some delicious food and I felt much better. I hope I don't get sick again.", "type": "Narrative", "topic": "Last week, I had a cold and I felt very sick.", "conclusion": "I hope I don't get sick again."}, {"passage": "If I could go to anyplace in the world, I would like to go to Paris. Paris is a city in France. It is famous for its old buildings, its paintings and its cuisine. Among the buildings in Paris, I want to visit the Eiffel Tower the most. I would like to climb to the top of it. I also want to go to the Louvre Museum and see the \"Mona Lisa\". I hope I can visit Paris someday.", "type": "Expository", "topic": "If I could go to anyplace in the world, I would like to go to Paris.", "conclusion": "I hope I can visit Paris someday."}, {"passage": "My dream is to be a scientist. I like to do experiments. I want to make a big discovery through my experiments and become the greatest scientist in my country. I also want to win Nobel Prize. I think I will be a good scientist because I am good at thinking logically. However, I sometimes a little careless. I need to be attention to be a good scientist. One day, I will make my dream come true!", "type": "Expository", "topic": "My dream is to be a scientist.", "conclusion": "One day, I will make my dream come true!"}, {"passage": "My neighborhood is a perfect place to live in. I have lived in it for three years. It is very close to my school. I can get to school in ten minutes on foot. There are many stores in my neighborhood. The grocery store is two blocks from my house. Across the street from the grocery store, there is a bakery, a bank and a post office. Best of all, my neighborhood has a community garden. My friend and I often meet there and play together. I like my neighborhood so much.", "type": "Descriptive", "topic": "My neighborhood is a perfect place to live in.", "conclusion": "I like my neighborhood so much."}], "model_paragraphs": [{"topic": "A famous scientist", "text": "Galileo Galilei was one of the most famous scientists in history. He was an Italian astronomer who lived hundreds of years ago. He built his own telescope and used it to observe the moon, planets and stars. His careful observations helped prove that the Earth revolves around the sun. He faced a lot of trouble for sharing his ideas openly, but he never stopped searching for the truth. Galileo's discoveries started a scientific revolution that changed the way people understand the universe."}, {"topic": "Your best friend", "text": "My best friend's name is Adam. We have known each other since primary school. He is cheerful, kind and always ready to help me. We enjoy playing football together every weekend and sharing our favorite stories. When I feel sad, he always makes me laugh with his funny jokes. He is honest and never lets me down. I feel very lucky to have such a wonderful friend, and I hope our friendship lasts forever."}]}, "model_tests": [{"title": "Model Test (1)", "listening_note": "These questions are answered while listening to the audio recording that goes with this test (not included in this worksheet), so no fixed answer key is given here.", "listening1": ["Which film are Mario and Tamara going to see? (Robot 2075 – Forever – Midnight Moon)", "The film Wargames is a/an (romantic – action – comedy) film", "They are going to meet at (7:00 – 7:15 – 7:30)"], "listening2": ["Susan's teacher is 53 years old.", "There are about twenty students in the class.", "The student James wants to go to Brazil next year."], "reading": {"passage": "I love technology. Technology has brought many changes in our lives. It is found all around us. It is important for businesses and industries. It's very useful for me. Technology helps us to do our work. We use it every day. We can send messages, do search and play games. But to stay safe online, you have to follow some important tips. First, keep your password secret. You shouldn't tell people your personal information. Don't make friends with people you don't know online. Don't send photos to people you don't know. If you are worried or in a trouble, tell a parent or a teacher. Fortunately, technology can help to make our lives easier.", "qa": [["What is the main idea of the passage?", "Technology has changed our lives in many useful ways, but we must stay safe while using it online."], ["What should you do when you are in a trouble?", "Tell a parent or a teacher."], ["How can technology help us to do our work?", "It helps us send messages, do research/search and play games, making our work and lives easier."]], "mcq": [["You should keep your (text- email- post- password) secret.", "password"], ["The underlined pronoun \"it\" refers to (call – phone – technology-photo).", "technology"]]}, "vocab_mcq": [["1. Followers and supporters are (antonyms – synonyms – opposites -verbs).", "synonyms"], ["2. I go to the (candy-book -hardware -grocery) store to buy some tools like hammers.", "hardware"], ["3. A scientist who studies the stars and planets is a/an (astronomer – astronaut– astrologer-singer).", "astronomer"], ["4. I go shopping (downtown-uptown- intersection-home). There are many shops there.", "downtown"], ["5. Rough and smooth are (antonyms – synonyms – nouns -verbs).", "antonyms"], ["6. How (many-often – much -tall) do you go on boat trips? I never go on boat trips.", "often"], ["7. My grandpa used (to play- play -plays -playing) tennis when he was young.", "to play"], ["8. How (did – do – does - is) you come to school yesterday?", "did"], ["9. I have a serious (space -issue- critical -help) with my boss. I think I will quit soon.", "issue"], ["10. I was lucky enough to have the (idea -issue-problem-opportunity) to travel abroad. It's my dream.", "opportunity"]], "rewrite": [["1. Ann bakes delicious cookies. (Delicious cookies)", "Delicious cookies are baked by Ann."], ["2. I used to play football when I was young. (not)", "I didn't use to play football when I was young."]], "paragraph": {"topic": "A famous scientist", "text": "Galileo Galilei was one of the most famous scientists in history. He was an Italian astronomer who built his own telescope to study the sky. His careful observations helped prove that the Earth revolves around the sun. Although he faced a lot of trouble for sharing his ideas, he never gave up searching for the truth. Galileo's discoveries changed the way people understand the universe forever."}}, {"title": "Model Test (2)", "listening_note": "These questions are answered while listening to the audio recording that goes with this test (not included in this worksheet), so no fixed answer key is given here.", "listening1": ["Harry is catching a bus at 10.", "They are meeting Jack at the bus station.", "At night, Fred is watching a film at the cinema."], "listening2": ["Laila and Zaid are going to the ___ this weekend.", "Megan and Ben's mum wants them to go ___ on Saturday.", "They are going to meet on ___ ."], "reading": {"passage": "Today, we are having a nice party. It's my sister's birthday. We are all happy and busy, too. I'm hanging up the steamers for the party. I use the scissors to cut the string. My brother is blowing up the balloons which are bright and colorful. We need to hang up them, too. My mom made a nice cake for my sister. My friends Ola and Mona are decorating the cake now. My sister is ten years old, so we have ten candles. My dad sent the invitations to our family and friends. We're going to eat the delicious cake, drink juice and sing songs. I hope my sister will be happy when she gets her presents. We are all very excited!", "qa": [["What is the writer doing?", "The writer is hanging up the streamers and cutting string to help get ready for the birthday party."], ["Who decorated the cake?", "Ola and Mona decorated the cake."], ["What did the father do? Why?", "The father sent the invitations to their family and friends, so they could come and celebrate the birthday together."]], "mcq": [["1. The main idea of the text is about \"My sister's ___ \" (a. birthday b. school c. balloons d. friends)", "a. birthday"], ["2. My sister is ___ years old. (a. nine b. seven c. ten d. thirteen)", "c. ten"]]}, "vocab_mcq": [["1. He could put out the fire. He is (cowardly – funny – courageous - shy).", "courageous"], ["2. She (get up - gets up - getting up - got up) early every day.", "gets up"], ["3. (Merchants – Scientists – Scholars -Astronomers) work in the market.", "Merchants"], ["4. I (take – takes – took - taking) some photos when I was on holiday.", "took"], ["5. It's (polite – impolite – happy - good) to talk when the food is in your mouth.", "impolite"], ["6. You mustn't (leave – leaves – leaving - left) the lights on when you go out.", "leave"], ["7. The synonym of the word \"patch\" is (park - piec function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function chunk(a,n){const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
const $=s=>document.querySelector(s);

/* ---------- Toast ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',3200);}

/* ---------- Text-to-speech with manual voice picker ---------- */
let ttsVoices=[], selectedVoiceURI='';
try{selectedVoiceURI=localStorage.getItem('pearl_tts_voice')||'';}catch(e){}
function populateVoiceSelect(){
  const sel=$('#voiceSelect'); if(!sel) return;
  const prev=sel.value||selectedVoiceURI;
  sel.innerHTML='<option value="">Default (Auto)</option>';
  const en=ttsVoices.filter(v=>/^en/i.test(v.lang)), ot=ttsVoices.filter(v=>!/^en/i.test(v.lang));
  [...en,...ot].forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o);});
  if(prev&&[...sel.options].some(o=>o.value===prev)) sel.value=prev;
}
function loadVoices(){ if(!('speechSynthesis' in window)) return; ttsVoices=window.speechSynthesis.getVoices(); populateVoiceSelect(); }
if('speechSynthesis' in window){
  loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices;
  setInterval(()=>{ if(window.speechSynthesis.speaking){window.speechSynthesis.pause();window.speechSynthesis.resume();} },4000);
}
$('#voiceSelect').addEventListener('change',function(){
  selectedVoiceURI=this.value;
  try{localStorage.setItem('pearl_tts_voice',selectedVoiceURI);}catch(e){}
  speak('This is how I sound now.',true);
});
function pickVoice(){
  if(!ttsVoices.length) loadVoices();
  if(selectedVoiceURI){const c=ttsVoices.find(v=>v.voiceURI===selectedVoiceURI); if(c) return c;}
  const pref=[/Google US English/i,/Microsoft.*Online.*Natural/i,/Microsoft Aria/i,/Microsoft Jenny/i,/Microsoft Guy/i,/Samantha/i,/Google UK English Female/i,/Microsoft Zira/i];
  for(const rx of pref){const v=ttsVoices.find(v=>rx.test(v.name)); if(v) return v;}
  return ttsVoices.find(v=>/en-US/i.test(v.lang))||ttsVoices.find(v=>/^en/i.test(v.lang))||ttsVoices[0]||null;
}
function speak(text,isTest){
  if(!('speechSynthesis' in window)){const m='هذا المتصفح لا يدعم النطق. افتح الملف في Chrome أو Edge.'; isTest?alert(m):toast(m); return;}
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=.92;u.pitch=1;u.volume=1;
    const v=pickVoice(); u.lang=v?v.lang:'en-US'; if(v) u.voice=v;
    let started=false; u.onstart=()=>{started=true;};
    u.onerror=e=>{const m='تعذّر تشغيل الصوت ('+e.error+'). افتح الملف في Chrome/Edge مباشرة.'; isTest?alert(m):toast(m);};
    window.speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started&&!window.speechSynthesis.speaking&&!window.speechSynthesis.pending){
      const m='لم يصدر صوت — تأكد من وجود صوت إنجليزي في إعدادات النطق (Windows: Settings > Speech) وافتح الملف في Chrome/Edge.'; isTest?alert(m+'\nVoices: '+ttsVoices.length):toast(m);} },1200);
  }catch(e){toast('خطأ في تشغيل الصوت: '+e.message);}
}

/* ---------- Sound effects & confetti ---------- */
let sfxOn=true, actx=null;
function beep(freqs,dur){
  if(!sfxOn) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.18,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+(i+1)*dur);
      o.connect(g);g.connect(actx.destination);o.start(t+i*dur);o.stop(t+(i+1)*dur);});
  }catch(e){}
}
function confetti(){
  const cols=['#2563eb','#7c3aed','#f59e0b','#16a34a','#dc2626'];
  for(let i=0;i<36;i++){
    const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';
    c.style.background=cols[i%cols.length];c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);
    const d=1500+Math.random()*1200;
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(100vh) rotate(${360+Math.random()*360}deg)`,opacity:.9}],{duration:d,easing:'ease-in'});
    setTimeout(()=>c.remove(),d+50);
  }
}

/* ---------- Slide builders ---------- */
const SL=[]; let lastKey='';
function push(grp,sec,html,cls){
  const key=grp+'|'+sec; const start=key!==lastKey; lastKey=key;
  SL.push({grp,sec,html,cls:cls||'',start});
}
const BL=/___\(\d+\)___|___/g;
const ALLBTNS=`<button class="btn sm" data-all="show">👁 Show all</button><button class="btn sm alt" data-all="hide">🙈 Hide all</button>`;
const TAPHINT=`<small dir="auto">اضغط على السطر لإظهار/إخفاء الإجابة</small>`;

function fillRow(t,ans){
  const n=(t.match(BL)||[]).length; let inner;
  if(n===0){ inner=t+`<div class="ans">✔ ${ans.join(' … ')}</div>`; }
  else { if(n===1) ans=[ans.join(' ')]; let i=0; inner=t.replace(BL,()=>{const a=ans[i++]; return a==null?'___':`<span class="blank">${a}</span>`;}); }
  return `<div class="row" data-tog>${inner}</div>`;
}
function fillSlide(title,box,rows,img){
  const chips=box?`<div class="chips">${box.map(w=>`<span class="chip">${w}</span>`).join('')}</div>`:'';
  const body=`<h2 class="st">${title} ${ALLBTNS} ${TAPHINT}</h2>${chips}${rows.join('')}`;
  return img?`<div class="inner split"><img class="map" src="${img}" alt="city map"><div>${body}</div></div>`:`<div class="inner">${body}</div>`;
}
function revealSlide(title,pairs){
  return `<div class="inner"><h2 class="st">${title} ${ALLBTNS} ${TAPHINT}</h2>${pairs.map(p=>`<div class="row" data-tog><div class="q">${p[0]}</div><div class="ans">${p[1]}</div></div>`).join('')}</div>`;
}
function mcqHtml(title,it,i,n){
  const q=it.q.replace(/___/g,'<span class="qb">_____</span>');
  return `<div class="inner mq"><div class="qh">${title} <b>${i+1}/${n}</b></div><div class="qt">${q}</div>
    <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-opt="${escAttr(o)}" data-correct="${escAttr(it.a)}"><span class="ltr">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="mqf"><button class="btn sm alt" data-reset>↻ إعادة السؤال</button></div></div>`;
}
function exSlides(grp,sec,ex,img){
  if(ex.type==='mcq'){ ex.items.forEach((it,i)=>push(grp,sec,mcqHtml(ex.title,it,i,ex.items.length))); }
  else if(ex.type==='fill_box'){
    const rows=ex.items.map((t,i)=>fillRow(t,[ex.answers[i]]));
    chunk(rows,5).forEach(c=>push(grp,sec,fillSlide(ex.title,ex.box,c)));
  }
  else if(ex.type==='fill_list'){
    const rows=ex.items.map(p=>fillRow(p[0],String(p[1]).split('…').map(s=>s.trim())));
    chunk(rows,5).forEach(c=>push(grp,sec,fillSlide(ex.title,null,c)));
  }
  else if(ex.type==='rewrite'){ chunk(ex.items,5).forEach(c=>push(grp,sec,revealSlide(ex.title,c))); }
  else if(ex.type==='match'){
    const rows=ex.pairs.map((p,i)=>`<div class="row" data-tog><b>${i+1}. ${p[0]}</b> → <span class="blank">${p[1]}</span></div>`);
    push(grp,sec,`<div class="inner"><h2 class="st">${ex.title} ${ALLBTNS} ${TAPHINT}</h2>${rows.join('')}</div>`);
  }
  else if(ex.type==='dialog'){
    let i=0;
    const rows=ex.lines.map(l=>{
      const t=l[1].replace(BL,()=>{const a=ex.answers[i++]; return a==null?'___':`<span class="blank">${a}</span>`;});
      return `<div class="row" data-tog><b>${l[0]}:</b> ${t}</div>`;
    });
    const body=`<h2 class="st">${ex.title} ${ALLBTNS} ${TAPHINT}</h2>${rows.join('')}`;
    push(grp,sec,img?`<div class="inner split"><img class="map" src="${img}" alt="city map"><div>${body}</div></div>`:`<div class="inner">${body}</div>`);
  }
  else if(ex.type==='note'){
    push(grp,sec,`<div class="inner"><h2 class="st">${ex.title}</h2><div class="rule">${ex.text}</div></div>`);
  }
}

/* quiz (word -> meaning) */
const QZ={};
function quizBody(id){
  const s=QZ[id]; if(!s.order.length) s.order=shuffle(s.pool);
  const w=s.order.pop();
  const others=shuffle(s.pool.filter(p=>p.w!==w.w)).slice(0,3).map(p=>p.m);
  const opts=shuffle([...others,w.m]);
  return `<div class="qh">🎯 Quick Quiz — <span class="qsc">${s.score}/${s.total}</span></div>
    <div class="qt">What does <span style="color:var(--primary)">“${w.w}”</span> mean? <button class="spk" data-say="${escAttr(w.w)}">🔊</button></div>
    <div class="opts small">${opts.map((o,k)=>`<button class="opt" data-opt="${escAttr(o)}" data-correct="${escAttr(w.m)}"><span class="ltr">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="mqf"><button class="btn" data-qznext="${id}">Next word ▶</button></div>`;
}

    push(grp,sec,`<div class="inner"><h2 class="st">🗝️ Key Vocabulary — ${u.key.length} words <small dir="auto">اضغط على الكلمة لسماعها</small></h2>
      <div class="wgrid">${u.key.map(k=>`<button class="wcard" data-say="${escAttr(k.w)}">${k.w}<small>${k.pos||''}</small></button>`).join('')}</div></div>`);
    u.key.forEach((k,i)=>push(grp,sec,`<div class="inner center"><div class="cnt">${i+1} / ${u.key.length}</div>${k.pos?`<span class="pos">${k.pos}</span>`:''}
      <div class="wword">${k.w} <button class="spk" data-say="${escAttr(k.w)}">🔊</button></div>
      <div class="mean" data-tog><div class="hint">👁 اضغط لإظهار المعنى</div><div class="ans">${k.m} <button class="spk sm" data-say="${escAttr(k.w+': '+k.m)}">🔊</button></div></div></div>`));
    QZ[id]={pool:u.key,order:[],score:0,total:0};

    const S=chunk(u.syn||[],7), A=chunk(u.ant||[],7), m=Math.max(S.length,A.length);

    for(let k=0;k<m;k++) push(grp,sec,`<div class="inner"><h2 class="st">🔁 Synonyms &amp; Antonyms ${ALLBTNS} ${TAPHINT}</h2><div class="sacols">${saT('Synonyms ≈',S[k])}${saT('Antonyms ↔',A[k])}</div></div>`);
    if(u.lang&&u.lang.length) chunk(u.lang,5).forEach((c,k,arr)=>push(grp,sec,`<div class="inner"><h2 class="st">💬 Language Functions ${arr.length>1?`(${k+1}/${arr.length})`:''} <small dir="auto">اضغط على الجملة لسماعها</small></h2>
      <ul class="lang">${c.map(t=>`<li data-say="${escAttr(t)}">🔊 ${t}</li>`).join('')}</ul></div>`));
    if(id==='t0u0'){
      push(grp,sec,`<div class="inner" style="height:100%;display:flex;flex-direction:column"><h2 class="st">🗺️ City Map <small dir="auto">استخدم القلم ✏️ لتتبّع الطريق</small></h2><div style="flex:1;min-height:0;display:flex"><img class="map" style="max-height:100%" src="${MAP_IMG}" alt="city map"></div></div>`);
      push(grp,sec,`<div class="inner split"><img class="map" src="${MAP_IMG}" alt="city map"><div>${revealSlide('🧭 Follow the directions (sample answers)',DIRECTION_PRACTICE).replace('<div class="inner">','').replace(/<\/div>$/,'')}</div></div>`);
    }
    (u.ex||[]).forEach(ex=>exSlides(grp,sec,ex,(id==='t0u0'&&ex.type==='dialog')?MAP_IMG:null));
  });
});

/* ---- grammar ---- */
function irregularHtml(rule){
  const doc=new DOMParser().parseFromString(rule,'text/html');
  const rows=[...doc.querySelectorAll('tr')].slice(1).map(tr=>[...tr.children].map(td=>td.textContent));
  const tabs=chunk(rows,Math.ceil(rows.length/3)).map(c=>`<table class="irr"><tr><th>Present</th><th>Past</th><th>P.P.</th></tr>${c.map(r=>`<tr data-tog><td>${r[0]}</td><td><span class="blank">${r[1]}</span></td><td><span class="blank">${r[2]}</span></td></tr>`).join('')}</table>`).join('');
  return `<div class="inner"><h2 class="st">📝 Irregular Verbs ${ALLBTNS} ${TAPHINT}</h2><div class="irrwrap">${tabs}</div></div>`;
}
DATA.grammar.forEach(g=>{
  const grp='📝 Grammar', sec=g.title;
  if(/Irregular/i.test(g.title)) push(grp,sec,irregularHtml(g.rule));
  else push(grp,sec,`<div class="inner"><h2 class="st">📝 ${g.title}</h2><div class="rule">${g.rule}</div></div>`);
  (g.ex||[]).forEach(ex=>exSlides(grp,sec,ex));
});

  const o=w.ex7_order, byL=Object.fromEntries(o.sentences.map(s=>[s[0],s[1]]));

/* ---------- Engine ---------- */
let cur=0, hist=[], fscale=1;
const host=$('#host'), pen=$('#pen'), pctx=pen.getContext('2d');
function sizePen(){pen.width=host.clientWidth;pen.height=host.clientHeight;}
function render(){
  const s=SL[cur];
  try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
  host.innerHTML=`<div class="slide ${s.cls}">${typeof s.html==='function'?s.html():s.html}</div>`;
  sizePen();
  $('#crumb').textContent=s.grp==='Cover'?'':`${s.grp}  ›  ${s.sec}`;
  $('#counter').textContent=`${cur+1} / ${SL.length}`;
  $('#progbar').style.width=((cur+1)/SL.length*100)+'%';
  document.querySelectorAll('.mitem').forEach(m=>m.classList.toggle('cur',false));
  const sectionStart=[...document.querySelectorAll('.mitem')].filter(m=>+m.dataset.go<=cur).pop();
  if(sectionStart) sectionStart.classList.add('cur');
  $('#histBtn').style.display=hist.length?'block':'none';
}
function go(i){cur=Math.max(0,Math.min(SL.length-1,i));render();}
function jump(i){ if(i!==cur){hist.push(cur);} go(i); }

function checkOpt(btn){
  const row=btn.closest('.opts'); if(!row||row.dataset.done) return; row.dataset.done='1';
  const ok=btn.dataset.opt===btn.dataset.correct;
  [...row.children].forEach(b=>{ if(b.dataset.opt===b.dataset.correct) b.classList.add('correct'); else if(b===btn) b.classList.add('wrong'); b.classList.add('locked'); });
  const qb=btn.closest('.slide').querySelector('.qb'); if(qb){qb.textContent=btn.dataset.correct; qb.classList.add('ok');}
  const qz=btn.closest('[data-qz]'); if(qz){const s=QZ[qz.dataset.qz]; s.total++; if(ok) s.score++; const sc=qz.querySelector('.qsc'); if(sc) sc.textContent=s.score+'/'+s.total;}
  if(ok){beep([660,880],.12);confetti();} else beep([220,170],.18);
}
function resetMcq(btn){
  const sl=btn.closest('.slide'); const row=sl.querySelector('.opts'); if(!row) return;
  delete row.dataset.done; [...row.children].forEach(b=>b.classList.remove('correct','wrong','locked'));
  const qb=sl.querySelector('.qb'); if(qb){qb.textContent='_____';qb.classList.remove('ok');}
}

document.addEventListener('click',e=>{
  const t=e.target; let el;
  if(el=t.closest('[data-say]')){speak(el.getAttribute('data-say')||'');return;}
  if(t.closest('[data-stopsay]')){try{speechSynthesis.cancel();}catch(x){}return;}
  if(t.closest('[data-next]')){go(cur+1);return;}
  if(el=t.closest('.opt')){checkOpt(el);return;}
  if(el=t.closest('[data-reset]')){resetMcq(el);return;}
  if(el=t.closest('[data-qznext]')){const box=el.closest('[data-qz]'); box.innerHTML=quizBody(el.dataset.qznext);return;}
  if(el=t.closest('[data-all]')){const show=el.dataset.all==='show'; el.closest('.slide').querySelectorAll('[data-tog]').forEach(x=>x.classList.toggle('shown',show)); return;}
  if(el=t.closest('[data-tog]')){el.classList.toggle('shown');return;}
  if(el=t.closest('[data-go]')){jump(+el.dataset.go);closeMenu();return;}
});

/* ---------- Menu ---------- */
(function buildMenu(){
  let html='', lastGrp='';
  SL.forEach((s,i)=>{ if(!s.start) return;
    if(s.grp!==lastGrp){html+=`<h4>${s.grp}</h4>`;lastGrp=s.grp;}
    html+=`<button class="mitem" data-go="${i}">${s.sec}</button>`;
  });
  $('#dlist').innerHTML=html;
})();
function openMenu(){$('#drawer').classList.add('open');$('#shade').classList.add('open');}
function closeMenu(){$('#drawer').classList.remove('open');$('#shade').classList.remove('open');}
$('#menuBtn').onclick=openMenu; $('#shade').onclick=closeMenu;
$('#prevBtn').onclick=()=>go(cur-1); $('#nextBtn').onclick=()=>go(cur+1);
$('#histBtn').onclick=()=>{ if(hist.length) go(hist.pop()); };
$('#testBtn').onclick=()=>speak('Hello! This is a test of the pronunciation feature.',true);
$('#sfxBtn').onclick=function(){sfxOn=!sfxOn;this.textContent='🔔 Sound effects: '+(sfxOn?'ON':'OFF');};

/* ---------- Theme / size / fullscreen ---------- */
function applyScale(){
  const base=Math.max(14,Math.min(innerWidth/62,innerHeight/34));
  document.documentElement.style.fontSize=(base*fscale)+'px';
  sizePen();
}
$('#fplus').onclick=()=>{fscale=Math.min(1.6,fscale+.1);applyScale();};
$('#fminus').onclick=()=>{fscale=Math.max(.7,fscale-.1);applyScale();};
$('#themeBtn').onclick=function(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');this.textContent=d?'🌙':'☀️';};
$('#fsBtn').onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} };
window.addEventListener('resize',applyScale);

/* ---------- Pen overlay ---------- */
let penOn=false, tool='#ef4444', drawing=false;
function setPen(on){penOn=on;pen.classList.toggle('on',on);$('#palette').classList.toggle('on',on);$('#penBtn').classList.toggle('on',on);}
$('#penBtn').onclick=()=>setPen(!penOn);
document.querySelectorAll('.pc').forEach(b=>b.addEventListener('click',()=>{
  const c=b.dataset.c;
  if(c==='clear'){pctx.clearRect(0,0,pen.width,pen.height);return;}
  tool=c; document.querySelectorAll('.pc').forEach(x=>x.classList.toggle('sel',x===b));
}));
function pos(e){const r=pen.getBoundingClientRect();return [(e.clientX-r.left)*(pen.width/r.width),(e.clientY-r.top)*(pen.height/r.height)];}
pen.addEventListener('pointerdown',e=>{
  if(!penOn) return; drawing=true; try{pen.setPointerCapture(e.pointerId);}catch(x){}
  const [x,y]=pos(e); pctx.beginPath(); pctx.moveTo(x,y); pctx.lineCap='round'; pctx.lineJoin='round';
  if(tool==='erase'){pctx.globalCompositeOperation='destination-out';pctx.lineWidth=40;pctx.strokeStyle='#000';pctx.globalAlpha=1;}
  else if(tool==='hl'){pctx.globalCompositeOperation='source-over';pctx.lineWidth=26;pctx.strokeStyle='#facc15';pctx.globalAlpha=.4;}
  else {pctx.globalCompositeOperation='source-over';pctx.lineWidth=5;pctx.strokeStyle=tool;pctx.globalAlpha=1;}
  pctx.lineTo(x+.01,y+.01); pctx.stroke();
});
pen.addEventListener('pointermove',e=>{ if(!drawing) return; const [x,y]=pos(e); pctx.lineTo(x,y); pctx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(ev=>pen.addEventListener(ev,()=>{drawing=false;}));
document.querySelector('.pc[data-c="#ef4444"]').classList.add('sel');

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(/SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='Home') go(0); else if(e.key==='End') go(SL.length-1);
  else if(e.key==='p'||e.key==='P') setPen(!penOn);
  else if(e.key==='f'||e.key==='F') $('#fsBtn').click();
  else if(e.key==='Escape') closeMenu();
});

applyScale(); render();
</script>
